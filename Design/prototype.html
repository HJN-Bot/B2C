<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeakSpark — Practice Room Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #fff; font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  /* KTV Score Bar */
  .ktv-bar {
    padding: 10px 20px;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    flex-shrink: 0;
  }
  .ktv-dim { display: flex; flex-direction: column; gap: 4px; }
  .ktv-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 0.5px; }
  .ktv-track { height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .ktv-fill { height: 100%; border-radius: 2px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
  .ktv-fill.fluency { background: linear-gradient(90deg,#3b82f6,#06b6d4); width: 72%; }
  .ktv-fill.vocab   { background: linear-gradient(90deg,#8b5cf6,#ec4899); width: 58%; }
  .ktv-fill.logic   { background: linear-gradient(90deg,#10b981,#84cc16); width: 45%; }
  .ktv-fill.duration{ background: linear-gradient(90deg,#f59e0b,#ef4444); width: 30%; }
  .ktv-val { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.6); }

  /* ── Karaoke Subtitle Zone ── */
  .karaoke-zone {
    flex-shrink: 0;
    padding: 10px 28px 8px;
    height: 80px;
    overflow: hidden;
    position: relative;
  }
  /* 滚动容器：多行，从底部向上推 */
  .karaoke-lines {
    position: absolute;
    bottom: 8px;
    left: 28px; right: 28px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: transform 0.35s ease;
  }
  .kline {
    font-size: 19px;
    font-weight: 500;
    line-height: 1.45;
    word-break: break-word;
    white-space: normal;
    color: rgba(255,255,255,0.28);
    transition: color 0.4s, opacity 0.4s;
  }
  .kline.active {
    color: rgba(255,255,255,0.85);
  }
  /* 当前正在识别的词：青色高亮 */
  .kw-interim {
    color: #06b6d4;
    text-shadow: 0 0 10px rgba(6,182,212,0.55);
    border-bottom: 2px solid rgba(6,182,212,0.7);
    padding-bottom: 1px;
  }
  .karaoke-placeholder {
    font-size: 15px;
    color: rgba(255,255,255,0.16);
    letter-spacing: 0.5px;
  }

  /* ── Practice Area ── */
  .practice-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    position: relative;
    padding-bottom: 24px;
    gap: 20px;
  }

  /* Waveform — bottom up */
  canvas#wave {
    display: block;
    /* glow reflection via filter */
    filter: drop-shadow(0 0 10px rgba(6,182,212,0.2));
  }
  .listening-label {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .listening-label.active { color: #06b6d4; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

  /* Mic button */
  .mic-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 1;
  }
  .mic-btn {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg,#3b82f6,#06b6d4);
    border: none;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 0 0 0 rgba(6,182,212,0.4);
    transition: all 0.2s;
  }
  .mic-btn.recording {
    background: linear-gradient(135deg,#ef4444,#f97316);
    animation: micPulse 1.5s infinite;
  }
  @keyframes micPulse {
    0%   { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
    70%  { box-shadow: 0 0 0 18px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }
  .mic-hint { font-size: 11px; color: rgba(255,255,255,0.25); letter-spacing: 1px; }

  /* Reaction Bubbles */
  .bubble {
    position: absolute;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13px;
    pointer-events: none;
    animation: floatUp 3.2s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(16px) scale(0.85); }
    12%  { opacity: 1; transform: translateY(0) scale(1); }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-28px); }
  }

  /* Highlight Flash */
  .highlight-flash {
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translate(-50%,-50%);
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    pointer-events: none;
    z-index: 10;
  }
  .highlight-flash.show { display: flex; animation: flashIn 1.8s ease-out forwards; }
  @keyframes flashIn {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(0.5); }
    20%  { opacity:1; transform:translate(-50%,-50%) scale(1.2); }
    40%  { transform:translate(-50%,-50%) scale(1); }
    70%  { opacity:1; }
    100% { opacity:0; transform:translate(-50%,-65%); }
  }
  .flash-score { font-size: 30px; font-weight: 800; color: #fbbf24; text-shadow: 0 0 24px rgba(251,191,36,0.8); }
  .flash-label { font-size: 11px; color: rgba(251,191,36,0.8); letter-spacing: 2px; }

  /* Particles */
  .particle {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    pointer-events: none;
    animation: particleOut 1.1s ease-out forwards;
  }
  @keyframes particleOut {
    0%   { opacity:1; transform:translate(0,0) scale(1); }
    100% { opacity:0; transform:var(--tx) scale(0); }
  }

  /* Bottleneck Card */
  .bottleneck-card {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(130px);
    background: rgba(14,18,32,0.97);
    border: 1px solid rgba(99,102,241,0.35);
    border-radius: 16px;
    padding: 15px 18px;
    width: 310px;
    transition: transform 0.45s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 5;
  }
  .bottleneck-card.show { transform: translateX(-50%) translateY(0); }
  .bn-title { font-size: 10px; color: #818cf8; letter-spacing: 1.5px; margin-bottom: 7px; }
  .bn-text { font-size: 14px; color: rgba(255,255,255,0.82); line-height: 1.5; margin-bottom: 11px; }
  .bn-actions { display: flex; gap: 8px; }
  .btn-use {
    flex: 1; background: rgba(99,102,241,0.18); border: 1px solid rgba(99,102,241,0.4);
    color: #a5b4fc; padding: 7px; border-radius: 8px; font-size: 12px; cursor: pointer;
  }
  .btn-skip {
    background: transparent; border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.35); padding: 7px 14px; border-radius: 8px;
    font-size: 12px; cursor: pointer;
  }

  /* Bottom Bar */
  .bottom-bar {
    flex-shrink: 0;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.025);
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .stat { font-size: 13px; color: rgba(255,255,255,0.4); }
  .stat span { color: #fbbf24; font-weight: 600; }
  .btn-end {
    background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.28);
    color: #f87171; padding: 7px 18px; border-radius: 20px; font-size: 12px; cursor: pointer;
  }

  /* Demo controls */
  .demo-controls {
    position: fixed; top: 10px; right: 10px;
    display: flex; gap: 5px; z-index: 30;
  }
  .demo-btn {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.65); padding: 5px 10px; border-radius: 7px;
    font-size: 10px; cursor: pointer; transition: all 0.2s;
  }
  .demo-btn:hover { background: rgba(255,255,255,0.14); color:#fff; }

  /* Speech API notice */
  .speech-notice {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3);
    color: #fbbf24; padding: 6px 14px; border-radius: 10px; font-size: 11px;
    display: none; z-index: 20;
  }
</style>
</head>
<body>

<div class="demo-controls">
  <button class="demo-btn" onclick="triggerHighlight()">✨ Highlight</button>
  <button class="demo-btn" onclick="triggerBubble()">💬 Reaction</button>
  <button class="demo-btn" onclick="toggleBottleneck()">💡 Bottleneck</button>
  <button class="demo-btn" onclick="boostKTV()">📈 Score+</button>
  <button class="demo-btn" onclick="demoCaption()">📝 Caption</button>
</div>

<!-- KTV Score Bar -->
<div class="ktv-bar">
  <div class="ktv-dim">
    <div style="display:flex;justify-content:space-between">
      <span class="ktv-label">FLUENCY</span>
      <span class="ktv-val" id="v-fluency">72</span>
    </div>
    <div class="ktv-track"><div class="ktv-fill fluency" id="f-fluency"></div></div>
  </div>
  <div class="ktv-dim">
    <div style="display:flex;justify-content:space-between">
      <span class="ktv-label">VOCABULARY</span>
      <span class="ktv-val" id="v-vocab">58</span>
    </div>
    <div class="ktv-track"><div class="ktv-fill vocab" id="f-vocab"></div></div>
  </div>
  <div class="ktv-dim">
    <div style="display:flex;justify-content:space-between">
      <span class="ktv-label">LOGIC</span>
      <span class="ktv-val" id="v-logic">45</span>
    </div>
    <div class="ktv-track"><div class="ktv-fill logic" id="f-logic"></div></div>
  </div>
  <div class="ktv-dim">
    <div style="display:flex;justify-content:space-between">
      <span class="ktv-label">DURATION</span>
      <span class="ktv-val" id="v-dur">30</span>
    </div>
    <div class="ktv-track"><div class="ktv-fill duration" id="f-dur"></div></div>
  </div>
</div>

<!-- Karaoke Subtitle Zone -->
<div class="karaoke-zone" id="karaokeZone">
  <div class="karaoke-lines" id="karaokeLines">
    <div class="kline active">
      <span class="karaoke-placeholder">Start speaking — your words will appear here...</span>
    </div>
  </div>
</div>

<!-- Practice Area -->
<div class="practice-area" id="practiceArea">
  <div class="listening-label" id="listenLabel">TAP MIC TO START</div>

  <!-- Bottom-up waveform -->
  <canvas id="wave" width="360" height="140"></canvas>

  <!-- Mic -->
  <div class="mic-wrap">
    <button class="mic-btn" id="micBtn" onclick="toggleRecording()">🎙️</button>
    <span class="mic-hint" id="micHint">TAP TO SPEAK</span>
  </div>

  <!-- Highlight Flash -->
  <div class="highlight-flash" id="hlFlash">
    <div class="flash-score">+20 ⭐</div>
    <div class="flash-label">GREAT EVIDENCE!</div>
  </div>

  <!-- Bottleneck Card -->
  <div class="bottleneck-card" id="bnCard">
    <div class="bn-title">💡 KEEP GOING</div>
    <div class="bn-text">"Can you give a real-world example of that?"</div>
    <div class="bn-actions">
      <button class="btn-use" onclick="dismissBottleneck()">Use this prompt</button>
      <button class="btn-skip" onclick="dismissBottleneck()">Skip</button>
    </div>
  </div>
</div>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <div class="stat">⭐ <span id="hlCount">0</span> highlights</div>
  <div class="stat">🕐 <span id="timer">00:00</span></div>
  <button class="btn-end">End Session</button>
</div>

<div class="speech-notice" id="speechNotice">⚠️ Chrome/Edge required for live captions</div>

<script>
// ─── Waveform Engine (bottom-up, breathing) ───────────────────────────────
const canvas = document.getElementById('wave')
const ctx    = canvas.getContext('2d')
let isRecording = false
let phase = 0
let breathPhase = 0
let audioCtx, analyser, dataArray, micSource

function drawWave() {
  ctx.clearRect(0, 0, canvas.width, canvas.height)
  const W = canvas.width, H = canvas.height
  const bars = 56
  const totalW = W * 0.82
  const barW = Math.floor(totalW / bars / 1.6)
  const spacing = totalW / bars
  const startX = (W - totalW) / 2

  // If real mic data available, use it
  let freqData = null
  if (analyser && isRecording) {
    analyser.getByteFrequencyData(dataArray)
    freqData = dataArray
  }

  for (let i = 0; i < bars; i++) {
    const x = startX + i * spacing

    let amp
    if (!isRecording) {
      // Breathing: slow sine wave, low amplitude
      breathPhase += 0.0008
      amp = (Math.sin(breathPhase * 2 + i * 0.18) * 0.5 + 0.5) * 14 + 3
    } else if (freqData) {
      // Real mic: map frequency bin to bar
      const binIdx = Math.floor((i / bars) * (freqData.length * 0.65))
      const raw = freqData[binIdx] / 255
      amp = Math.pow(raw, 1.4) * (H * 0.88) + 3
    } else {
      // Simulated: organic multi-sine
      const t = phase
      amp = (
        Math.sin(t * 1.0 + i * 0.35) * 0.4 +
        Math.sin(t * 1.7 + i * 0.22) * 0.3 +
        Math.sin(t * 2.3 + i * 0.45) * 0.2 +
        Math.abs(Math.sin(t * 0.5 + i * 0.1)) * 0.1
      )
      amp = (amp * 0.5 + 0.5) * (H * 0.88) + 3
    }

    // Color: bottom = deep blue, mid = cyan, top = orange-yellow
    const ratio = amp / H
    let r, g, b
    if (ratio < 0.45) {
      r = 30 + ratio * 80; g = 100 + ratio * 180; b = 220
    } else if (ratio < 0.75) {
      const t = (ratio - 0.45) / 0.3
      r = 30 + t * 220; g = 180 + t * 60; b = 220 - t * 180
    } else {
      const t = (ratio - 0.75) / 0.25
      r = 250; g = 180 - t * 80; b = 40 - t * 30
    }
    const alpha = isRecording ? 0.85 : 0.35

    // Bar grows from bottom
    ctx.fillStyle = `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${alpha})`
    const bh = Math.max(amp, 3)
    ctx.beginPath()
    ctx.roundRect(x - barW/2, H - bh, barW, bh, [barW/2, barW/2, 0, 0])
    ctx.fill()

    // Glow cap at top of bar
    if (isRecording && amp > 20) {
      const grad = ctx.createRadialGradient(x, H - amp, 0, x, H - amp, barW * 2.5)
      grad.addColorStop(0, `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},0.5)`)
      grad.addColorStop(1, 'transparent')
      ctx.fillStyle = grad
      ctx.beginPath()
      ctx.arc(x, H - amp, barW * 2.5, 0, Math.PI * 2)
      ctx.fill()
    }
  }

  if (isRecording) phase += 0.07
  breathPhase += 0.015
  requestAnimationFrame(drawWave)
}
drawWave()

// ─── Real Mic via Web Audio API ────────────────────────────────────────────
async function startMicAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
    audioCtx = new (window.AudioContext || window.webkitAudioContext)()
    analyser = audioCtx.createAnalyser()
    analyser.fftSize = 128
    dataArray = new Uint8Array(analyser.frequencyBinCount)
    micSource = audioCtx.createMediaStreamSource(stream)
    micSource.connect(analyser)
  } catch(e) {
    // Mic denied — simulated mode continues
  }
}

// ─── Speech Recognition (Karaoke Captions) ─────────────────────────────────
let recognition = null
let finalTranscript = ''
const SR = window.SpeechRecognition || window.webkitSpeechRecognition

if (!SR) {
  document.getElementById('speechNotice').style.display = 'block'
  setTimeout(() => document.getElementById('speechNotice').style.display='none', 4000)
}

function startSpeechRecognition() {
  if (!SR) return
  recognition = new SR()
  recognition.continuous = true
  recognition.interimResults = true
  recognition.lang = 'en-US'

  recognition.onresult = (e) => {
    let interim = ''
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript + ' '
      else interim = e.results[i][0].transcript
    }
    renderKaraoke(finalTranscript, interim)
  }

  recognition.onerror = () => {}
  recognition.onend = () => { if (isRecording) recognition.start() }
  recognition.start()
}

function stopSpeechRecognition() {
  if (recognition) { recognition.onend = null; recognition.stop(); recognition = null }
}

// 分行缓冲：每行约 8 个词换一行
const WORDS_PER_LINE = 8
let lineBuffer = []   // [{words:[], isFinal:bool}]
let currentLine = []  // 当前行的已确认词

function renderKaraoke(done, interim) {
  const container = document.getElementById('karaokeLines')

  // 清空占位符（首次）
  if (container.querySelector('.karaoke-placeholder')) {
    container.innerHTML = ''
    lineBuffer = []
    currentLine = []
  }

  // 把 done 文本切成词
  const allWords = done.trim().split(/\s+/).filter(Boolean)

  // 重建分行：每 WORDS_PER_LINE 词一行
  const lines = []
  for (let i = 0; i < allWords.length; i += WORDS_PER_LINE) {
    lines.push(allWords.slice(i, i + WORDS_PER_LINE).join(' '))
  }
  if (lines.length === 0) lines.push('')

  // 当前行还有空位，把 interim 加进去显示
  const currentLineText = lines[lines.length - 1]
  const currentLineWords = currentLineText ? currentLineText.split(' ') : []
  const hasRoomForInterim = currentLineWords.length < WORDS_PER_LINE

  // 渲染：最多显示 2 行（上一行 + 当前行）
  const displayLines = lines.slice(-2)
  container.innerHTML = ''

  displayLines.forEach((lineText, idx) => {
    const isLast = idx === displayLines.length - 1
    const div = document.createElement('div')
    div.className = 'kline' + (isLast ? ' active' : '')
    div.textContent = lineText

    // 最后一行：追加 interim 词
    if (isLast && interim) {
      div.textContent = lineText ? lineText + ' ' : ''
      const iSpan = document.createElement('span')
      iSpan.className = 'kw-interim'
      iSpan.textContent = interim
      div.appendChild(iSpan)
    }
    container.appendChild(div)
  })

  // 如果只有一行时给上面留空行，保持底部对齐感
  if (displayLines.length < 2) {
    container.insertAdjacentHTML('afterbegin', '<div class="kline"></div>')
  }
}

// Demo captions
const demoSentences = [
  'Artificial intelligence is transforming',
  'the way we interact with technology',
  'For example, research shows that',
  'neural networks can now achieve',
  'human-level performance on many tasks',
]
let demoIdx = 0
function demoCaption() {
  if (demoIdx < demoSentences.length) {
    finalTranscript += demoSentences[demoIdx++] + ' '
    renderKaraoke(finalTranscript, '')
  } else {
    demoIdx = 0; finalTranscript = ''
    const container = document.getElementById('karaokeLines')
    container.innerHTML = '<div class="kline active"><span class="karaoke-placeholder">Start speaking — your words will appear here...</span></div>'
  }
}

// ─── Recording Toggle ───────────────────────────────────────────────────────
let hlCount = 0, seconds = 0, timerInterval = null, scores = {fluency:72,vocab:58,logic:45,dur:30}

function toggleRecording() {
  isRecording = !isRecording
  const btn = document.getElementById('micBtn')
  const label = document.getElementById('listenLabel')
  const hint = document.getElementById('micHint')

  btn.classList.toggle('recording', isRecording)
  btn.textContent = isRecording ? '⏹️' : '🎙️'

  if (isRecording) {
    label.textContent = 'LISTENING...'; label.classList.add('active')
    hint.textContent = 'TAP TO STOP'
    finalTranscript = ''
    startMicAudio()
    startSpeechRecognition()
    timerInterval = setInterval(() => {
      seconds++
      const m = String(Math.floor(seconds/60)).padStart(2,'0')
      const s = String(seconds%60).padStart(2,'0')
      document.getElementById('timer').textContent = `${m}:${s}`
      if (scores.dur < 95) { scores.dur = Math.min(95, scores.dur+0.4); updateKTV('dur',scores.dur) }
    }, 1000)
    setTimeout(() => { if(isRecording) triggerBubble() }, 3500)
    setTimeout(() => { if(isRecording) triggerHighlight() }, 8000)
    setTimeout(() => { if(isRecording) triggerBubble() }, 14000)
  } else {
    label.textContent = 'TAP MIC TO START'; label.classList.remove('active')
    hint.textContent = 'TAP TO SPEAK'
    stopSpeechRecognition()
    clearInterval(timerInterval)
    if (audioCtx) { audioCtx.close(); audioCtx=null; analyser=null }
  }
}

// ─── Reaction Bubbles ────────────────────────────────────────────────────────
const bubbles = [
  {icon:'🔥',text:"You're on fire!"}, {icon:'⭐',text:'Great example!'},
  {icon:'👏',text:'Nice transition!'}, {icon:'💡',text:'Very clear!'},
  {icon:'✨',text:'Strong vocab!'}, {icon:'🎯',text:'Good evidence!'},
]
function triggerBubble() {
  const b = bubbles[Math.floor(Math.random()*bubbles.length)]
  const el = document.createElement('div')
  el.className = 'bubble'
  el.innerHTML = `${b.icon} <span>${b.text}</span>`
  el.style.left = (15 + Math.random()*65) + '%'
  el.style.top  = (20 + Math.random()*45) + '%'
  document.getElementById('practiceArea').appendChild(el)
  setTimeout(() => el.remove(), 3300)
}

// ─── Highlight Flash ─────────────────────────────────────────────────────────
function triggerHighlight() {
  hlCount++
  document.getElementById('hlCount').textContent = hlCount
  spawnParticles()
  const opts = [{pts:15,lbl:'GREAT PHRASE!'},{pts:20,lbl:'NICE EVIDENCE!'},{pts:25,lbl:'STRONG EXAMPLE!'},{pts:30,lbl:'POWER VOCAB!'}]
  const o = opts[Math.floor(Math.random()*opts.length)]
  const el = document.getElementById('hlFlash')
  el.querySelector('.flash-score').textContent = `+${o.pts} ⭐`
  el.querySelector('.flash-label').textContent = o.lbl
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show')
  setTimeout(() => el.classList.remove('show'), 1900)
  boostKTV()
}

function spawnParticles() {
  const area = document.getElementById('practiceArea')
  const cx = area.offsetWidth/2, cy = area.offsetHeight * 0.38
  for (let i=0; i<14; i++) {
    const p = document.createElement('div')
    p.className = 'particle'
    const angle = (i/14)*Math.PI*2
    const dist = 55 + Math.random()*45
    p.style.cssText = `left:${cx}px;top:${cy}px;--tx:translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px);`
    p.style.background = ['#fbbf24','#f97316','#ec4899','#a78bfa','#06b6d4'][i%5]
    area.appendChild(p)
    setTimeout(() => p.remove(), 1200)
  }
}

// ─── Bottleneck ───────────────────────────────────────────────────────────────
let bnVisible = false
function toggleBottleneck() { bnVisible=!bnVisible; document.getElementById('bnCard').classList.toggle('show',bnVisible) }
function dismissBottleneck() { bnVisible=false; document.getElementById('bnCard').classList.remove('show') }

// ─── KTV Scores ───────────────────────────────────────────────────────────────
function boostKTV() {
  ['fluency','vocab','logic'].forEach(d => {
    scores[d] = Math.min(98, scores[d]+3+Math.random()*5)
    updateKTV(d, scores[d])
  })
}
function updateKTV(dim, val) {
  const ids = {fluency:'fluency',vocab:'vocab',logic:'logic',dur:'dur'}
  const v = Math.round(val)
  document.getElementById('f-'+ids[dim]).style.width = v+'%'
  document.getElementById('v-'+ids[dim]).textContent = v
  if (v >= 88) {
    document.getElementById('f-'+ids[dim]).style.background = 'linear-gradient(90deg,#fbbf24,#f97316)'
    document.getElementById('f-'+ids[dim]).style.boxShadow = '0 0 6px rgba(251,191,36,0.5)'
  }
}
